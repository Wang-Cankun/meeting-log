name: macOS build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build and ad-hoc sign
        run: scripts/build-app.sh
      - name: Archive app
        run: ditto -c -k --sequesterRsrc --keepParent .build/MeetingLog.app .build/MeetingLog-macOS-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MeetingLog-macOS-arm64
          path: .build/MeetingLog-macOS-arm64.zip
          include-hidden-files: true
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MeetingLog-macOS-arm64
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" MeetingLog-macOS-arm64.zip --verify-tag --generate-notes --title "$RELEASE_TAG"
