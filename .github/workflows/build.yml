name: macOS build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build, ad-hoc sign, and verify DMG
        run: scripts/build-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: MeetingLog-macOS-arm64
          path: .build/MeetingLog-macOS-arm64.dmg
          include-hidden-files: true
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MeetingLog-macOS-arm64
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" MeetingLog-macOS-arm64.dmg --verify-tag --generate-notes --title "$RELEASE_TAG" --notes 'Requires macOS 26 or later on Apple Silicon. Open the DMG and drag MeetingLog to Applications. Ad-hoc signed, not notarized; first launch may require approval in System Settings → Privacy & Security.'
